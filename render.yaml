# Render Blueprint: free web service running the bot (long polling) plus a
# /health endpoint on $PORT that UptimeRobot pings to stop the instance sleeping.
services:
  - type: web
    name: topjobs-telegram-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    branch: main
    # Deploy a push to main only after GitHub Actions (.github/workflows/ci.yml) passes.
    autoDeployTrigger: checksPass
    envVars:
      # Secret: Render asks for it when the Blueprint is created. Never commit it.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TOPJOBS_ENABLED
        value: "true"
      - key: TOPJOBS_CATEGORY
        value: "SDQ"
      - key: SEND_JOB_IMAGES
        value: "true"
      # Only set to "true" once XpressJobs has given written permission.
      - key: XPRESSJOBS_ENABLED
        value: "false"
      - key: SCRAPE_MIN_INTERVAL_SECS
        value: "2"
      - key: HTTP_TIMEOUT_SECS
        value: "20"
      - key: CACHE_TTL_HOURS
        value: "6"
      - key: HTTP_RETRIES
        value: "2"
      - key: SITE_BACKOFF_MINUTES
        value: "30"
      - key: STALE_CACHE_MAX_HOURS
        value: "48"
      - key: ALERT_AFTER_FAILURES
        value: "3"
      - key: RATE_LIMIT_COOLDOWN_SECS
        value: "10"
      - key: RATE_LIMIT_SEARCHES_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_USER_FETCHES_PER_DAY
        value: "30"
      - key: RATE_LIMIT_GLOBAL_FETCHES_PER_DAY
        value: "500"
      - key: ADMIN_USER_IDS
        sync: false
      - key: REQUIRED_CHANNEL
        sync: false
      - key: REQUIRED_CHANNEL_LINK
        sync: false
