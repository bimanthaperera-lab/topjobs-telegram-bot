# Posts software engineering jobs to a Telegram channel four times a day, 5 per run:
# new jobs first (tagged "🆕 New Match"), then the top-ranked jobs not posted in the
# last 24 hours. See jobbot/notify.py.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN  the bot's token
#   NOTIFY_CHAT_ID      the channel: "@channelname" or its numeric id (-100...)
# The bot must be an admin of the channel with permission to post messages.
# Optional repository variable (Variables tab, same page):
#   XPRESSJOBS_ENABLED   "true" to also post XpressJobs' jobs. Only with XpressJobs' permission.
#   NOTIFY_REPOST_HOURS  hours before a job can be posted again (default 24, e.g. 48).
name: Job alerts

on:
  schedule:
    # 08:00, 12:00, 16:00 and 20:00 Sri Lanka time (UTC+5:30). GitHub may start runs a few minutes late.
    - cron: "30 2,6,10,14 * * *"
  workflow_dispatch: # "Run workflow" button for testing

permissions:
  contents: read

concurrency:
  group: job-alerts
  cancel-in-progress: false # never let two runs post the same jobs

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the list of jobs already posted
        uses: actions/cache/restore@v4
        with:
          path: .notify-state
          # Each run saves under its own key; restore-keys picks the newest one.
          key: notify-state-${{ github.run_id }}
          restore-keys: notify-state-

      - name: Post software engineering jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
          NOTIFY_STATE_FILE: .notify-state/seen.json
          XPRESSJOBS_ENABLED: ${{ vars.XPRESSJOBS_ENABLED }}
          NOTIFY_REPOST_HOURS: ${{ vars.NOTIFY_REPOST_HOURS }}
        run: python -m jobbot.notify

      - name: Save the list of jobs already posted
        # Also after a partial failure, so jobs that did get posted are never posted twice.
        if: always() && hashFiles('.notify-state/seen.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .notify-state
          key: notify-state-${{ github.run_id }}
